# A tracked build (a release or a preview) made supported on Linux: its zip exported and checked with its server and
# the agent (pnpm support), then exported (into a copy of bedrock-data, kept nowhere but as this run's artifact) and
# tested. Where it passes, a pull request marks it "supported" in versions/<channel>/<build>.json; merging it runs the
# extract workflow, which exports the build into bedrock-data. Where it fails, an issue asks for its support, with the
# log. Windows is supported locally (pnpm support <build> on Windows). Run by the track workflow for each new build, or
# by hand.
name: support

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'The tracked build to support, as its zip names it (1.26.52.3)'
        required: true
      channel:
        description: "The build's channel"
        type: choice
        options: [release, preview]
        default: release

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: support-${{ inputs.build }}
  cancel-in-progress: false

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD: ${{ inputs.build }}
      CHANNEL: ${{ inputs.channel }}
      BRANCH: support/${{ inputs.build }}
      BEDROCK_DATA_DIR: bedrock-data
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # main as it is when the run starts: the build track just committed
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Check out bedrock-data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BEDROCK_DATA_REPO }}
          path: bedrock-data
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native
      - name: Try Linux
        id: support
        shell: bash
        run: |
          set -o pipefail
          pnpm support "$BUILD" --channel="$CHANNEL" --platform=linux 2>&1 | tee support.log || echo 'failed=true' >> "$GITHUB_OUTPUT"
          if ! git diff --quiet -- "versions/$CHANNEL/$BUILD.json"; then echo 'marked=true' >> "$GITHUB_OUTPUT"; fi
      - name: Export and test
        id: test
        if: steps.support.outputs.marked == 'true'
        shell: bash
        run: |
          set -o pipefail
          { pnpm extract "$BUILD" --channel="$CHANNEL" --force && pnpm test; } 2>&1 | tee -a support.log
      - name: Keep what it exported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-${{ inputs.build }}
          path: |
            support.log
            bedrock-data/${{ inputs.channel }}/${{ inputs.build }}/
            cache/${{ inputs.channel }}/${{ inputs.build }}/*/out/agent.log
          if-no-files-found: ignore
      - name: Open the pull request
        if: steps.support.outputs.marked == 'true' && steps.test.outcome == 'success'
        run: |
          platforms=$(grep -oE "$CHANNEL/$BUILD: supported on .*\(" support.log | sed -E 's/.*supported on (.*) \(/\1/')
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add "versions/$CHANNEL/$BUILD.json"
          git commit -q -m "Support $BUILD on $platforms"
          git push -q --force origin "$BRANCH"
          exported=$(grep -E "$CHANNEL/$BUILD: " support.log | sed 's/^ *//')
          body=$(printf 'Exports and passes the tests on %s.\n\n```\n%s\n```\n\nMerging this runs the extract workflow, which exports it into bedrock-data. What it exported is the run'"'"'s artifact: %s\n' "$platforms" "$exported" "$RUN_URL")
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Support BDS $BUILD" --body "$body"
          fi
      - name: Open an issue
        if: always() && (steps.support.outputs.failed == 'true' || steps.test.outcome == 'failure')
        run: |
          body=$(printf 'Supporting %s failed: %s\n\n```\n%s\n```\n' "$BUILD" "$RUN_URL" "$(tail -n 60 support.log)")
          issue=$(gh issue list --state open --search "\"Support BDS $BUILD\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Support BDS $BUILD" --body "$body"
          fi
