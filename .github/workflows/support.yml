# A tracked release made supported: added to supported.json, exported (into a copy of bedrock-data, kept nowhere but as
# this run's artifact) and tested. Where that works, a pull request adds it to supported.json; merging it runs the
# extract workflow, which exports it into bedrock-data. Where it does not, an issue asks for its support, with the log.
# Run by the track workflow for each new release, or by hand.
name: support

on:
  workflow_dispatch:
    inputs:
      build:
        description: 'The tracked release to support, as its zip names it (1.26.52.3)'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: support-${{ inputs.build }}
  cancel-in-progress: false

jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BUILD: ${{ inputs.build }}
      BRANCH: support/${{ inputs.build }}
      BEDROCK_DATA_DIR: bedrock-data
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Check out bedrock-data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BEDROCK_DATA_REPO }}
          path: bedrock-data
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add to supported.json, export and test
        id: try
        shell: bash
        run: |
          set -o pipefail
          { pnpm support "$BUILD" && pnpm extract "$BUILD" --force && pnpm test; } 2>&1 | tee support.log
      - name: Keep what it exported
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-${{ inputs.build }}
          path: |
            support.log
            bedrock-data/release/${{ inputs.build }}/
          if-no-files-found: ignore
      - name: Open the pull request
        if: success()
        run: |
          if git diff --quiet -- supported.json; then
            echo "$BUILD is supported already"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add supported.json
          git commit -q -m "Support $BUILD"
          git push -q --force origin "$BRANCH"
          exported=$(grep -E "release/$BUILD: " support.log | sed 's/^ *//')
          body=$(printf 'Exports and passes the tests: %s\n\n```\n%s\n```\n\nMerging this runs the extract workflow, which exports it into bedrock-data. What it exported is the run'"'"'s artifact: %s\n' "$BUILD" "$exported" "$RUN_URL")
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = OPEN ]; then
            gh pr edit "$BRANCH" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Support BDS $BUILD" --body "$body"
          fi
      - name: Open an issue
        if: failure() && steps.try.outcome == 'failure'
        run: |
          body=$(printf 'Exporting or testing %s failed: %s\n\n```\n%s\n```\n' "$BUILD" "$RUN_URL" "$(tail -n 60 support.log)")
          issue=$(gh issue list --state open --search "\"Support BDS $BUILD\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --title "Support BDS $BUILD" --body "$body"
          fi
