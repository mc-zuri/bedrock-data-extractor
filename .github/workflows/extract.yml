# Each supported release into bedrock-data, on a push to main that changes what is supported (a merged support pull
# request) or how it is exported. Releases are read from their Linux zip (a release supported only on Windows is
# exported locally). A release bedrock-data has the data of is left as it is; run by hand with builds and
# force to export those again. The commit goes straight to bedrock-data's main.
name: extract

on:
  push:
    branches: [main]
    paths: ['versions/release/**', 'src/**', 'native/**', 'package.json', 'pnpm-lock.yaml']
  workflow_dispatch:
    inputs:
      builds:
        description: 'Releases to export, as their zips name them (space-separated); empty: each supported one bedrock-data lacks'
        required: false
        default: ''
      force:
        description: 'Export them again even where bedrock-data has them'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bedrock-data
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      # through bedrock-data's write deploy key: it can push there and nowhere else, and its pushes run bedrock-data's
      # workflows (a GITHUB_TOKEN's would not)
      - name: Check out bedrock-data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BEDROCK_DATA_REPO }}
          ssh-key: ${{ secrets.BEDROCK_DATA_DEPLOY_KEY }}
          path: bedrock-data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/native
      # what extract writes, checked against this bedrock-data's schemas before any server runs
      - name: Test
        env:
          BEDROCK_DATA_DIR: bedrock-data
        run: pnpm test
      - name: Export
        env:
          BEDROCK_DATA_DIR: bedrock-data
          BUILDS: ${{ inputs.builds }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: pnpm extract $BUILDS $FORCE
      - name: Commit to bedrock-data
        working-directory: bedrock-data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'bedrock-data already says this'
            exit 0
          fi
          releases=$(git diff --cached --name-only | grep -oE '^release/[^/]+' | sort -u | wc -l)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'Extract releases' -m "Releases changed: ${releases}. Extracted by https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git pull -q --rebase
          git push -q
