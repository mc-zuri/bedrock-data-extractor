# What minecraft.net offers, into versions/: every 6 hours, each build that is new (both channels) has its zips hashed,
# and the result is committed to main. Each new release is then handed to the support workflow, which tries to export
# it. Run by hand with builds (1.21.42.01 1.26.52.3) to track those instead, again with force.
name: track

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      builds:
        description: 'Builds to track, as their zips name them (space-separated); empty: what minecraft.net offers now'
        required: false
        default: ''
      channel:
        description: "The builds' channel"
        type: choice
        options: [release, preview]
        default: release
      force:
        description: 'Hash their zips again even where tracked already'
        type: boolean
        default: false

permissions:
  contents: write
  # running the support workflow (a GITHUB_TOKEN can run a workflow_dispatch, though its pushes run none)
  actions: write

concurrency:
  group: track
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # main as it is when the run starts, not when it was queued: a track run waiting on another builds on what that pushed
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Track
        env:
          BUILDS: ${{ inputs.builds }}
          CHANNEL: ${{ inputs.channel || 'release' }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: pnpm track $BUILDS --channel="$CHANNEL" $FORCE
      - name: Commit to main
        id: commit
        run: |
          git add versions
          if git diff --cached --quiet; then
            echo 'nothing new'
            exit 0
          fi
          tracked=$(git diff --cached --name-only -- versions | grep -oE '(release|preview)/[0-9.]+[0-9]' | sort -u | paste -sd ' ' -)
          releases=$(git diff --cached --name-only --diff-filter=A -- versions/release | grep -oE '[0-9]+(\.[0-9]+){3}' | paste -sd ' ' -)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m "track ${tracked:-versions.json}"
          git pull -q --rebase
          git push -q
          echo "releases=$releases" >> "$GITHUB_OUTPUT"
      - name: Try to support each new release
        if: steps.commit.outputs.releases != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASES: ${{ steps.commit.outputs.releases }}
        run: |
          for build in $RELEASES; do
            gh workflow run support.yml --ref main -f build="$build"
            echo "support $build: started"
          done
