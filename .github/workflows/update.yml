# What minecraft.net offers, into bedrock-data: every 6 hours, each build that is new there (or kept without all it
# should have) is downloaded, hashed and, for a release, extracted; the commit goes straight to bedrock-data's main.
# Run by hand with builds (1.21.42.01 1.26.52.3) to extract those instead, again with force.
name: update

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      builds:
        description: 'Builds to extract, as their zips name them (space-separated); empty: what minecraft.net offers now'
        required: false
        default: ''
      channel:
        description: "The builds' channel"
        type: choice
        options: [release, preview]
        default: release
      force:
        description: 'Download and extract them again even where kept with all they should have'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bedrock-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Check out bedrock-data
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.BEDROCK_DATA_REPO }}
          token: ${{ secrets.BEDROCK_DATA_TOKEN }}
          path: bedrock-data
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extract
        env:
          BEDROCK_DATA_DIR: bedrock-data
          BUILDS: ${{ inputs.builds }}
          CHANNEL: ${{ inputs.channel }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: |
          if [ -n "$BUILDS" ]; then
            pnpm extract $BUILDS --channel="$CHANNEL" $FORCE
          else
            pnpm track $FORCE
          fi
      - name: Commit to bedrock-data
        working-directory: bedrock-data
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo 'nothing new'
            exit 0
          fi
          builds=$(git diff --cached --name-only | grep -oE '^(release|preview)/[^/]+' | sort -u | paste -sd ' ' -)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "${builds:-versions.json}" -m "Extracted by https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
          git push
